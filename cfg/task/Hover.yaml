name: Hover

defaults:
  # see https://hydra.cc/docs/advanced/overriding_packages/
  - /base/env_base@_here_
  - /base/sim_base@_here_
  - randomization@_here_ # Include the randomization settings
  - disturbances@_here_ # Include the disturbance settings

env:
  num_envs: 64
  env_spacing: 6
  max_episode_length: 200

curriculum:
  enable: true
  # Start large enough to exercise horizontal control while retaining a
  # gentle curriculum toward the full 2.5 m operating range.
  start_xy_radius: 1.0
  end_xy_radius: 2.5
  start_z_half_range: 0.35
  end_z_half_range: 0.5
  warmup_episodes: 200

drone_model:
  name: BlueROV
  controller: null
# Start with a model-free-independent low-level controller.  Override with
# ``task.control_mode=direct`` to recover six-dimensional direct PPO actions.
control_mode: pid

pid:
  # BlueROV's horizontal damping is relatively strong; these gains produce
  # enough force to correct a 0.2--0.5 m offset without relying on PPO.
  position_gain: [4.0, 4.0, 5.0]
  integral_gain: [0.2, 0.2, 0.3]
  velocity_gain: [5.0, 5.0, 6.0]
  attitude_gain: [0.8, 0.8, 0.5]
  angular_rate_gain: [0.15, 0.15, 0.12]
  integral_limit: 1.0
  integral_decay: 0.995
  water_density: 997.0
force_sensor: false
time_encoding: true

reward_effort_weight: 0.03
reward_action_smoothness_weight: 0.02
reward_velocity_weight: 0.1
reward_distance_scale: 1.2
reward_position_weight: 0.8
reward_heading_weight: 0.2
reward_near_target_weight: 0.15
near_target_radius: 0.35
reward_position_precision_weight: 0.3
reward_success_weight: 0.2
success_position_radius: 0.15
success_velocity_threshold: 0.2

# Fraction of the new command applied at each simulation step.  Lower values
# reduce command chatter for either direct or high-level control.
action_smoothing: 0.2

# Integral of the target-relative position error, exposed as three additional
# observations.  PID also keeps its own integral state for low-level control.
position_error_integral:
  enable: true
  decay: 0.995
  limit: 1.0

# Expose the previous filtered command to PPO.
include_previous_action: true

action_transform: null

name: Hover

defaults:
  # see https://hydra.cc/docs/advanced/overriding_packages/
  - /base/env_base@_here_
  - /base/sim_base@_here_
  - randomization@_here_ # Include the randomization settings
  - disturbances@_here_ # Include the disturbance settings

env:
  num_envs: 64
  env_spacing: 6
  max_episode_length: 200

curriculum:
  enable: true
  start_xy_radius: 0.5
  end_xy_radius: 2.5
  start_z_half_range: 0.25
  end_z_half_range: 0.5
  warmup_episodes: 200

drone_model:
  name: BlueROV
  controller: null
force_sensor: false
time_encoding: true

reward_effort_weight: 0.03
reward_action_smoothness_weight: 0.02
reward_velocity_weight: 0.1
reward_distance_scale: 1.2
reward_position_weight: 0.8
reward_heading_weight: 0.2
reward_near_target_weight: 0.15
near_target_radius: 0.35
reward_position_precision_weight: 0.3
reward_success_weight: 0.2
success_position_radius: 0.15
success_velocity_threshold: 0.2

# Fraction of the new PPO action applied at each simulation step.  Lower
# values reduce visible thruster chatter while keeping direct actuation.
action_smoothing: 0.2

# Integral of the target-relative position error, exposed to PPO as three
# additional observations.  This gives direct control a memory for removing
# steady-state bias without adding a hand-written PID action mixer.
position_error_integral:
  enable: true
  decay: 0.995
  limit: 1.0

# Expose the previous filtered direct-control command to PPO.
include_previous_action: true

action_transform: null
